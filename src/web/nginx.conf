# The site's web container: nginx as an unprivileged user, serving the built
# React app and proxying /api to the API container. Every path it writes is
# under /tmp; the container's root can be read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
                              '"path":"$uri","bytes":$body_bytes_sent,"ms":$request_time,'
                              '"ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  # Behind Traefik this is the origin's own view of the
  # request; the forwarded headers are what the API trusts, and only from private
  # networks.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 8080;
    absolute_redirect off;
    root /srv/web;
    index index.html;

    # Scripts only from this origin. Styles allow inline because React sets style
    # attributes (the reveal component, the theme). No frames, no objects, no forms
    # to anyone else. Images may be data: (the grain texture lives in CSS) and the
    # favicon is local. connect-src is self: the API is same-origin through /api.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # HTML stays fresh in the browser, but a shared cache (Cloudflare) may keep
    # it for five minutes and serve stale while it revalidates. Assets below are
    # content-addressed, so they get a year instead.
    add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400, stale-if-error=86400" always;

    error_page 404 /404.html;

    # One URL per page: /platform/ is not a second copy of /platform.
    if ($uri ~ ^(.+)/$) {
      return 301 $1$is_args$args;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      client_max_body_size 32k;
      # The API sets its own cache rules for the changelog.
      add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      access_log off;
      try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?|txt|xml|webmanifest)$ {
      add_header Cache-Control "public, max-age=604800" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      access_log off;
      try_files $uri =404;
    }

    # The prerendered routes are folders with their own index.html. A path that
    # is not one of them is a real 404, with a rendered 404 page; it is not a soft
    # 200 for the app.
    location = / {
      try_files /index.html =404;
    }

    location = /fa {
      try_files /fa/index.html =404;
    }

    location /fa/ {
      try_files $uri/index.html $uri =404;
      error_page 404 /fa/404.html;
    }

    location / {
      try_files $uri/index.html $uri =404;
    }
  }
}
