# binchitects.com: nginx as an unprivileged user, serving one static page.
# Every path it writes is under /tmp; the container's root can be read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
                              '"path":"$uri","bytes":$body_bytes_sent,"ms":$request_time,'
                              '"ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  server {
    listen 8080;
    absolute_redirect off;
    root /srv/site;
    index index.html;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # HTML stays fresh in the browser, but a shared cache (Cloudflare) may keep
    # it for five minutes and serve stale while it revalidates. Assets below are
    # content-addressed, so they get a year instead.
    add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400, stale-if-error=86400" always;

    error_page 404 /404.html;

    # One URL per page: /platform/ is not a second copy of /platform.
    if ($uri ~ ^(.+)/$) {
      return 301 $1$is_args$args;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      access_log off;
      try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?|txt|xml|webmanifest)$ {
      add_header Cache-Control "public, max-age=604800" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      access_log off;
      try_files $uri =404;
    }

    location /fa/ {
      try_files $uri $uri/index.html =404;
      error_page 404 /fa/404.html;
    }

    location / {
      try_files $uri $uri/index.html =404;
    }
  }
}
