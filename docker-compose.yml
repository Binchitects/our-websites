name: argus-site

# One stack, two domains. Traefik terminates TLS with the certificate and key
# named in .env, routes each hostname to its own web image, and redirects HTTP
# to HTTPS. The API is never published: only Traefik's 80/443 are.
services:
  edge:
    image: traefik:v3.6
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${TLS_CERT_FILE:-./deploy/tls/fullchain.pem}:/certs/cert.pem:ro
      - ${TLS_KEY_FILE:-./deploy/tls/privkey.pem}:/certs/key.pem:ro
    depends_on:
      web:
        condition: service_healthy
      binchitects:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      # Read a 0600 private key owned by the deploying user; nothing else on the
      # host is mounted into the edge.
      - DAC_OVERRIDE
    networks:
      - internal

  api:
    image: argus-site-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: src/api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Production
      Site__DataDirectory: /data
      Site__ContactPermitLimit: ${CONTACT_PERMIT_LIMIT:-5}
      Site__ContactWindowMinutes: ${CONTACT_WINDOW_MINUTES:-10}
      Site__IpHashSalt: ${IP_HASH_SALT:-}
      Site__AdminToken: ${ADMIN_TOKEN:-}
      Site__ContactWebhookUrl: ${CONTACT_WEBHOOK_URL:-}
      Site__GitHubToken: ${GITHUB_TOKEN:-}
    volumes:
      - site-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    healthcheck:
      test: ["CMD", "dotnet", "Argus.Site.Api.dll", "--healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  binchitects:
    image: binchitects-site-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: src/binchitects/Dockerfile
    labels:
      traefik.enable: "true"
      traefik.http.routers.binchitects.rule: Host(`${BINCHIECTS_DOMAIN:-binchitects.com}`)
      traefik.http.routers.binchitects.entrypoints: websecure
      traefik.http.routers.binchitects.tls: "true"
      traefik.http.services.binchitects.loadbalancer.server.port: "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  web:
    image: argus-site-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: src/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.argus.rule: Host(`${ARGUS_DOMAIN:-argus.binchitects.com}`)
      traefik.http.routers.argus.entrypoints: websecure
      traefik.http.routers.argus.tls: "true"
      traefik.http.services.argus.loadbalancer.server.port: "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  site-data:

networks:
  internal:
    driver: bridge
