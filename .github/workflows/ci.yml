name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web — type, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: api — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/api/Argus.Site.Api.csproj -c Release --nologo

  images:
    name: images — build and smoke
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait
        env:
          ADMIN_TOKEN: ci-token
          IP_HASH_SALT: ci-salt
      - name: Smoke the site and the API
        run: |
          BASE_URL=http://127.0.0.1:8080 tests/smoke/web.sh
          BASE_URL=http://127.0.0.1:8080 ADMIN_TOKEN=ci-token SKIP_RATE_LIMIT=1 tests/smoke/api.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
