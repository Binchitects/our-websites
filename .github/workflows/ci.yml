name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web — type, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  binchitects:
    name: binchitects — type, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/binchitects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/binchitects/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: api — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/api/Argus.Site.Api.csproj -c Release --nologo

  images:
    name: images — build and smoke
    runs-on: ubuntu-latest
    needs: [web, binchitects, api]
    steps:
      - uses: actions/checkout@v4
      - name: Make a self-signed certificate and a local .env
        run: |
          mkdir -p deploy/tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout deploy/tls/privkey.pem -out deploy/tls/fullchain.pem \
            -subj "/CN=binchitects.com" \
            -addext "subjectAltName=DNS:argus.binchitects.com,DNS:binchitects.com"
          sudo sh -c 'printf "\n127.0.0.1 argus.binchitects.com binchitects.com\n" >> /etc/hosts'
          cat > .env <<'ENV'
          ARGUS_DOMAIN=argus.binchitects.com
          BINCHIECTS_DOMAIN=binchitects.com
          TLS_CERT_FILE=./deploy/tls/fullchain.pem
          TLS_KEY_FILE=./deploy/tls/privkey.pem
          HTTP_PORT=80
          HTTPS_PORT=443
          IP_HASH_SALT=ci-salt
          ADMIN_TOKEN=ci-token
          ENV
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke both sites and the API through Traefik
        run: |
          BASE_URL=https://argus.binchitects.com CURL_OPTS="-k" tests/smoke/web.sh
          BASE_URL=https://argus.binchitects.com CURL_OPTS="-k" \
            ADMIN_TOKEN=ci-token SKIP_RATE_LIMIT=1 tests/smoke/api.sh
          BASE_URL=https://binchitects.com CURL_OPTS="-k" tests/smoke/binchitects.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
